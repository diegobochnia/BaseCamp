<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avisos | BaseCamp</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <header class="bg-green-900 text-white shadow-md">
        <div class="mx-auto flex max-w-6xl items-center justify-between px-8 py-5">

            <a href="../index.html" class="text-2xl font-bold tracking-wide">
                BaseCamp
            </a>

            <nav aria-label="Navegação principal">
                <ul class="flex items-center gap-2 text-sm font-medium">
                    <li>
                        <a href="../index.html" class="block rounded-md px-4 py-2 transition hover:bg-green-800">
                            Início
                        </a>
                    </li>

                    <li>
                        <a href="integrantes.html" class="block rounded-md px-4 py-2 transition hover:bg-green-800">
                            Integrantes
                        </a>
                    </li>

                    <li>
                        <a href="secoes.html" class="block rounded-md px-4 py-2 transition hover:bg-green-800">
                            Seções
                        </a>
                    </li>

                    <li>
                        <a href="atividades.html" class="block rounded-md px-4 py-2 transition hover:bg-green-800">
                            Atividades
                        </a>
                    </li>

                    <li>
                        <a href="conquistas.html" class="block rounded-md px-4 py-2 transition hover:bg-green-800">
                            Conquistas
                        </a>
                    </li>

                    <li>
                        <a href="avisos.html" aria-current="page" class="block rounded-md bg-green-800 px-4 py-2">
                            Avisos
                        </a>
                    </li>
                </ul>
            </nav>

        </div>
    </header>

    <main class="mx-auto max-w-7xl px-8 py-8">
        <div class="flex justify-between items-center w-full">
            <h1 class="text-2xl font-bold text-green-900">Avisos</h1>
        </div>
        <section class="flex flex-col lg:flex-row w-full min-h-screen gap-6 p-6">

            <div class="w-full lg:w-[70%] border border-black rounded-3xl p-6 bg-white">
                <h2 class="text-xl font-bold text-green-800 mb-4">Lista de avisos</h2>
                <div id="cardsAvisos" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>

            <div id="campoNovoAviso"
                class="w-full lg:w-1/3 border border-black rounded-3xl p-6 bg-white space-y-4 sticky top-6 self-start">
                <h2 class="text-xl font-bold text-green-800">Novo Aviso</h2>

                <form id="formAviso" class="space-y-4 w-full">

                    <div class="w-full">
                        <label for="avisoTitulo" class="block mb-1 text-sm font-semibold text-gray-700">Título:</label>
                        <input type="text" id="avisoTitulo" name="titulo" placeholder="Digite o título do aviso"
                            class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-green-600 bg-gray-50/50">
                    </div>

                    <div class="w-full">
                        <label for="avisoMensagem"
                            class="block mb-1 text-sm font-semibold text-gray-700">Mensagem:</label>
                        <textarea id="avisoMensagem" name="mensagem" rows="3" placeholder="Digite a mensagem do aviso"
                            class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-green-600 bg-gray-50/50 resize-none"></textarea>
                    </div>

                    <div class="w-full">
                        <label for="avisoData" class="block mb-1 text-sm font-semibold text-gray-700">Data:</label>
                        <input type="date" id="avisoData" name="data"
                            class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-green-600 bg-gray-50/50">
                    </div>

                    <div class="pt-2">
                        <button type="button" id="avisoPublicar"
                            class="rounded-xl bg-green-700 px-6 py-2.5 text-white font-medium transition hover:bg-green-800">Publicar</button>
                    </div>
                    <div id="areaSalvarAviso" class="pt-2"></div>
                </form>
            </div>
        </section>
    </main>

    <script src="../assests/js/avisos.js"></script>
</body>

</html>
