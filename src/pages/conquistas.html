<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conquistas</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="container bg-body-tertiary py-5">
    <h1>Cadastro de Conquistas</h1>
    <div id="alterar" class="list-group mt-4"></div>
    <input type="text" id="conquistas_id" class="form-control mb-3" placeholder="ID da conquista" />
    <input
      type="text"
      id="conquistas_name"
      class="form-control mb-3"
      placeholder="Nome da conquista"
    />
    <input
      type="text"
      id="conquistas_desc"
      class="form-control mb-3"
      placeholder="Descrição da conquista"
    />

    <button id="btn" class="btn btn-primary">Enviar</button>
    <div id="alterar" class="list-group mt-4"></div>

    <p id="p_des"></p>
  </body>
  <script src="conquistas.js"></script>
</html>
