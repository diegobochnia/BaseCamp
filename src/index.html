<body>

            <a href="index.html" class="text-2xl font-bold tracking-wide">
                <span class="text-yellow-400">Base</span><span class="text-green-300">Camp</span>
            </a>

            <nav aria-label="Navegação principal">
                <ul class="flex items-center gap-2 text-sm font-medium">

                            Início
                        </a>
                    </li>

                    <li>
                        <a href="pages/integrantes.html"
                            class="block rounded-md px-4 py-2 transition hover:bg-green-800">

                        </a>
                    </li>

                    <li>
                        <a href="pages/secoes.html"
                            class="block rounded-md px-4 py-2 transition hover:bg-green-800">

                        </a>
                    </li>

                    <li>
                        <a href="pages/atividades.html"
                            class="block rounded-md px-4 py-2 transition hover:bg-green-800">
                            Atividades
                        </a>
                    </li>

                    <li>
                        <a href="pages/conquistas.html"
                            class="block rounded-md px-4 py-2 transition hover:bg-green-800">
                            Conquistas
                        </a>
                    </li>

                    <li>
                        <a href="pages/avisos.html"
                            class="block rounded-md px-4 py-2 transition hover:bg-green-800">
                            Avisos
                        </a>
                    </li>
                    <!-- painel de login com o icone icon-user -->
                    <li>
                        <a href="pages/login.html" class="block rounded-md px-4 py-2 transition hover:bg-green-800">
                            <svg width="1.25em" height="1.25em" aria-hidden="true"><use href="#icon-user"/></svg>
                            Entrar
                        </a>
                    </li>
                </ul>
            </nav>

        </div>
    </header>

    <main class="mx-auto max-w-6xl px-8 py-8">
        <h1 class="text-2xl font-bold text-green-900">BaseCamp</h1>
        <p class="mt-2">Selecione uma opção no menu para acessar os cadastros.</p>
    </main>
</body>
