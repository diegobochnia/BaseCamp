<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integrantes | BaseCamp</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="../assests/js/cabecalho.js" defer></script>
</head>

<body class="w-screen">
    <header class="bg-green-900 text-white shadow-md">
        <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-x-3 gap-y-4 px-4 py-4 sm:px-6 lg:flex-nowrap lg:gap-6">
            <a href="../index.html" class="flex shrink-0 items-center gap-2 lg:gap-3 rounded-md focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-yellow-400" aria-label="BaseCamp — página inicial">
                <img src="images/logo-basecamp.png" alt="" width="56" height="56" class="h-10 w-10 lg:h-14 lg:w-14 shrink-0 rounded-full object-contain" />
                <span class="whitespace-nowrap text-xl font-bold lg:text-2xl tracking-wide"><span class="text-yellow-400">Base</span><span class="text-green-300">Camp</span></span>
            </a>
            <div class="ml-auto flex items-center gap-2 lg:order-3 lg:ml-0">
                <button type="button" data-menu-toggle aria-controls="menu-principal" aria-expanded="false" aria-label="Abrir menu" class="flex h-11 w-11 items-center justify-center rounded-md transition hover:bg-green-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-yellow-400 lg:hidden">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-6 w-6" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
                </button>
                <a href="login.html" aria-label="Entrar" class="flex min-h-11 min-w-11 items-center justify-center gap-2 rounded-md px-3 py-2 transition focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-yellow-400 hover:bg-green-800"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-5 w-5 shrink-0" aria-hidden="true"><circle cx="12" cy="8" r="4" /><path d="M4 21v-2a8 8 0 0 1 16 0v2" /></svg><span class="hidden lg:inline">Entrar</span></a>
            </div>
            <nav id="menu-principal" aria-label="Navegação principal" class="hidden w-full min-w-0 lg:order-2 lg:block lg:w-auto lg:ml-auto">
                <ul class="flex flex-col gap-2 text-sm font-medium lg:flex-row lg:items-center">
                    <li><a href="../index.html" class="flex min-h-11 items-center justify-center gap-2 rounded-md px-3 py-2 transition focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-yellow-400 hover:bg-green-800">Início</a></li>
                    <li><a href="integrantes.html" aria-current="page" class="flex min-h-11 items-center justify-center gap-2 rounded-md px-3 py-2 transition focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-yellow-400 bg-green-800 font-bold text-yellow-300 ring-1 ring-inset ring-green-600">Integrantes</a></li>
                    <li><a href="secoes.html" class="flex min-h-11 items-center justify-center gap-2 rounded-md px-3 py-2 transition focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-yellow-400 hover:bg-green-800">Seções</a></li>
                    <li><a href="atividades.html" class="flex min-h-11 items-center justify-center gap-2 rounded-md px-3 py-2 transition focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-yellow-400 hover:bg-green-800">Atividades</a></li>
                    <li><a href="conquistas.html" class="flex min-h-11 items-center justify-center gap-2 rounded-md px-3 py-2 transition focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-yellow-400 hover:bg-green-800">Conquistas</a></li>
                    <li><a href="avisos.html" class="flex min-h-11 items-center justify-center gap-2 rounded-md px-3 py-2 transition focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-yellow-400 hover:bg-green-800">Avisos</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="mx-auto max-w-6xl px-8 py-8">
        <h1 class="text-2xl font-bold text-green-900">Integrantes</h1>

        <div class="mt-6 flex flex-col lg:flex-row gap-6 items-start">
            <div class="w-full lg:w-80 shrink-0 bg-white rounded-lg shadow-sm border border-zinc-200 p-5">
                <h2 class="text-sm font-semibold text-green-900 uppercase tracking-wide mb-4">Novo integrante</h2>

                <form class="flex flex-col gap-3">
                    <label class="flex flex-col gap-1 text-sm text-zinc-600">
                        Nome
                        <input type="text" placeholder="Nome completo" id="nome"
                            class="border border-zinc-300 rounded-md p-2 outline-none focus:border-green-900 transition" />
                    </label>

                    <label class="flex flex-col gap-1 text-sm text-zinc-600">
                        Data de nascimento
                        <input type="date" id="nascimento"
                            class="border border-zinc-300 rounded-md p-2 outline-none focus:border-green-900 transition" />
                    </label>

                    <label class="flex flex-col gap-1 text-sm text-zinc-600">
                        Telefone
                        <input type="text" placeholder="(00) 00000-0000" id="telefone"
                            class="border border-zinc-300 rounded-md p-2 outline-none focus:border-green-900 transition" />
                    </label>

                    <label class="flex flex-col gap-1 text-sm text-zinc-600">
                        Seção
                        <select name="secoes" id="secoes"
                            class="border border-zinc-300 rounded-md p-2 outline-none focus:border-green-900 transition">
                            <option value="">Selecione uma seção</option>
                            <option value="lobinho">Lobinho</option>
                            <option value="escoteiro">Escoteiro</option>
                            <option value="senior">Sênior</option>
                            <option value="pioneiro">Pioneiro</option>
                            <option value="chefe">Chefe</option>
                            <option value="administrativo">Administrativo</option>
                        </select>
                    </label>

                    <input type="button" value="Adicionar"
                        class="mt-2 bg-green-900 text-white py-2 px-4 rounded-md hover:bg-green-800 transition cursor-pointer font-medium"
                        id="add-integrante" />
                </form>
            </div>

            <div class="flex-1 w-full bg-white rounded-lg shadow-sm border border-zinc-200 p-5 overflow-x-auto">
                <h2 class="text-sm font-semibold text-green-900 uppercase tracking-wide mb-4">Lista de integrantes</h2>

                <table class="w-full text-sm border-collapse">
                    <thead>
                        <tr class="bg-green-900 text-white">
                            <th class="px-4 py-2 text-left rounded-l-md">Nome</th>
                            <th class="px-4 py-2 text-left">Data de Nascimento</th>
                            <th class="px-4 py-2 text-left">Telefone</th>
                            <th class="px-4 py-2 text-left">Seção</th>
                            <th class="px-4 py-2 text-left rounded-r-md">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="integrantes-table-body" class="divide-y divide-zinc-100">
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="../assests/js/integrantes.js"></script>
</body>
</html>
