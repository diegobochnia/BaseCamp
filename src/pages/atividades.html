<!-- Informa ao navegador que este arquivo usa HTML5. -->
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <!-- Define os caracteres e adapta a página para diferentes tamanhos de tela. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividades | BaseCamp</title>

    <!-- Carrega o Tailwind CSS, usado para estilizar os elementos da página. -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <!-- Cabeçalho com o nome do projeto e os links para as outras páginas. -->
    <header class="bg-green-900 text-white shadow-md">
        <div class="mx-auto flex max-w-6xl items-center justify-between px-8 py-5">

            <a href="../index.html" class="text-2xl font-bold tracking-wide">
                BaseCamp
            </a>

            <!-- Menu principal do site. -->
            <nav aria-label="Navegação principal">
                <ul class="flex items-center gap-2 text-sm font-medium">
                    <li>
                        <a href="../index.html"
                            class="block rounded-md px-4 py-2 transition hover:bg-green-800">
                            Início
                        </a>
                    </li>

                    <li>
                        <a href="integrantes.html"
                            class="block rounded-md px-4 py-2 transition hover:bg-green-800">
                            Integrantes
                        </a>
                    </li>

                    <li>
                        <a href="secoes.html"
                            class="block rounded-md px-4 py-2 transition hover:bg-green-800">
                            Seções
                        </a>
                    </li>

                    <li>
                        <a href="atividades.html" aria-current="page"
                            class="block rounded-md bg-green-800 px-4 py-2">
                            Atividades
                        </a>
                    </li>

                    <li>
                        <a href="conquistas.html"
                            class="block rounded-md px-4 py-2 transition hover:bg-green-800">
                            Conquistas
                        </a>
                    </li>

                    <li>
                        <a href="avisos.html"
                            class="block rounded-md px-4 py-2 transition hover:bg-green-800">
                            Avisos
                        </a>
                    </li>
                </ul>
            </nav>

        </div>
    </header>
    <!-- Conteúdo principal da página de atividades. -->
    <main class="mx-auto max-w-6xl px-8 py-8">
        <div class="mb-6 flex items-center justify-between gap-4">
            <h1 class="text-3xl font-bold text-green-900">Atividades</h1>
            <!-- Botão usado para atualizar os dados exibidos na lista. -->
            <button id="btn_upd" type="button"
                class="rounded-lg border border-green-300 bg-green-100 px-4 py-2 text-sm font-medium text-green-900 transition hover:bg-green-200">
                Atualizar
            </button>
        </div>

        <!-- Divide a área principal entre a lista e o formulário de cadastro. -->
        <div class="grid gap-6 lg:grid-cols-[1.2fr_0.8fr]">
            <!-- A lista começa vazia e pode ser preenchida pelo JavaScript. -->
            <section class="rounded-2xl border border-green-200 bg-white p-5 shadow-sm">
                <h2 class="mb-4 text-xl font-semibold text-green-900">Lista de atividades</h2>
                <ul id="listaatividades" class="space-y-3"></ul>
            </section>

            <!-- Formulário para informar os dados de uma nova atividade. -->
            <section class="rounded-2xl border border-green-200 bg-white p-5 shadow-sm">
                <h2 class="mb-4 text-xl font-semibold text-green-900">Cadastro de atividades</h2>

                <div class="space-y-4">
                    <label class="block">
                        <span class="mb-1 block text-sm font-medium text-slate-700">Nome</span>
                        <input type="text" id="Nome"
                            class="w-full rounded-lg border border-slate-300 bg-slate-50 px-3 py-2 text-sm outline-none transition focus:border-green-500 focus:bg-white">
                    </label>

                    <label class="block">
                        <span class="mb-1 block text-sm font-medium text-slate-700">Data</span>
                        <input type="text" id="Data"
                            class="w-full rounded-lg border border-slate-300 bg-slate-50 px-3 py-2 text-sm outline-none transition focus:border-green-500 focus:bg-white">
                    </label>
                    <label class="block">
                        <span class="mb-1 block text-sm font-medium text-slate-700">Horário</span>
                        <input type="text" id="Horario"
                            class="w-full rounded-lg border border-slate-300 bg-slate-50 px-3 py-2 text-sm outline-none transition focus:border-green-500 focus:bg-white">
                    </label>

                    <label class="block">
                        <span class="mb-1 block text-sm font-medium text-slate-700">Seção</span>
                        <input type="text" id="secçao"
                            class="w-full rounded-lg border border-slate-300 bg-slate-50 px-3 py-2 text-sm outline-none transition focus:border-green-500 focus:bg-white">
                    </label>

                    <label class="block">
                        <span class="mb-1 block text-sm font-medium text-slate-700">Descrição</span>
                        <textarea id="descrição" rows="3"
                            class="w-full resize-y rounded-lg border border-slate-300 bg-slate-50 px-3 py-2 text-sm outline-none transition focus:border-green-500 focus:bg-white"></textarea>
                    </label>

                    <!-- O botão adiciona a atividade; o espaço ao lado pode receber controles de edição. -->
                    <div class="flex items-center gap-3">
                        <button id="btn_add" type="button"
                            class="rounded-lg bg-green-700 px-4 py-2 text-sm font-semibold text-white transition hover:bg-green-800">
                            Adicionar
                        </button>
                        <div id="alterar" class="flex"></div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- Carrega o código JavaScript que controla as atividades desta página. -->
    <script src="../assests/js/atividades.js"></script>
</body>

</html>
