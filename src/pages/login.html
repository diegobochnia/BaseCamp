<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | BaseCamp</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <header class="bg-green-900 text-white shadow-md">
        <div class="mx-auto flex max-w-6xl items-center justify-between px-8 py-5">

            <img src="images/logo-basecamp.png" alt="Logo do BaseCamp" class="h-20 w-20 rounded-full" />
            <a href="index.html" class="text-2xl font-bold tracking-wide">
                <span class="text-yellow-400">Base</span><span class="text-green-300">Camp</span>
            </a>
            <nav aria-label="Navegação principal">
                <ul class="flex items-center gap-2 text-sm font-medium">
                    <li>
                        <a href="../index.html"
                            class="block rounded-md px-4 py-2 transition hover:bg-green-800">
                            Início
                        </a>
                    </li>

                    <li>
                        <a href="integrantes.html"
                            class="block rounded-md px-4 py-2 transition hover:bg-green-800">
                            Integrantes
                        </a>
                    </li>

                    <li>
                        <a href="secoes.html" aria-current="page"
                            class="block rounded-md bg-green-800 px-4 py-2">
                            Seções
                        </a>
                    </li>

                    <li>
                        <a href="atividades.html"
                            class="block rounded-md px-4 py-2 transition hover:bg-green-800">
                            Atividades
                        </a>
                    </li>

                    <li>
                        <a href="conquistas.html"
                            class="block rounded-md px-4 py-2 transition hover:bg-green-800">
                            Conquistas
                        </a>
                    </li>

                    <li>
                        <a href="avisos.html"
                            class="block rounded-md px-4 py-2 transition hover:bg-green-800">
                            Avisos
                        </a>
                    </li>

                    <li>
                        <a href="login.html" class="block rounded-md px-4 py-2 transition hover:bg-green-800">
                            <svg width="1.25em" height="1.25em" aria-hidden="true"><use href="#icon-user"/></svg>
                            Entrar
                        </a>
                    </li>
                </ul>
            </nav>

        </div>
    </header>

    <main class="mx-auto flex min-h-screen max-w-md items-center justify-center px-4 py-12">
        <section class="w-full rounded-xl border border-green-200 bg-white p-6 shadow-lg">
            <div class="mb-6 text-center">
                <p class="text-sm font-semibold uppercase tracking-[0.2em] text-green-700">BaseCamp</p>
                <h1 class="mt-2 text-3xl font-bold text-green-900">Entrar</h1>
            </div>

            <form id="loginForm" class="flex flex-col gap-4" data-login-url="/api/login" data-redirect-url="/index.html">
                <div class="flex flex-col gap-2">
                    <label for="email" class="text-sm font-medium text-green-900">E-mail</label>
                    <input
                        id="email"
                        name="email"
                        type="email"
                        required
                        autocomplete="email"
                        class="rounded-lg border border-green-200 bg-zinc-50 px-3 py-2.5 text-base outline-none transition focus:border-green-700 focus:ring-2 focus:ring-green-200"
                        placeholder="seu@email.com"
                    >
                </div>

                <div class="flex flex-col gap-2">
                    <label for="password" class="text-sm font-medium text-green-900">Senha</label>
                    <div class="relative">
                        <input
                            id="password"
                            name="password"
                            type="password"
                            required
                            autocomplete="current-password"
                            class="w-full rounded-lg border border-green-200 bg-zinc-50 px-3 py-2.5 pr-11 text-base outline-none transition focus:border-green-700 focus:ring-2 focus:ring-green-200"
                            placeholder="Digite sua senha"
                        >
                        <button
                            type="button"
                            data-toggle-password="#password"
                            aria-label="Mostrar senha"
                            aria-pressed="false"
                            class="absolute inset-y-0 right-0 flex items-center px-3 text-green-900 transition hover:text-green-700"
                        >
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5" aria-hidden="true">
                                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="rounded-lg bg-green-900 px-4 py-2.5 font-semibold text-white transition hover:bg-green-800 focus:outline-none focus:ring-2 focus:ring-green-200">
                    Entrar
                </button>
            </form>

            <div class="mt-6 border-t border-green-100 pt-4 text-center">
                <p class="text-sm text-zinc-600">Ainda não tem uma conta?</p>
                <a href="cadastro.html" class="mt-2 inline-flex rounded-lg border border-green-700 px-4 py-2 text-sm font-semibold text-green-800 transition hover:bg-green-50">
                    Criar conta
                </a>
            </div>

        </section>
    </main>

    <script src="../assests/login.js"></script>
</body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">

            <path fill="currentColor" fill-rule="evenodd"
            d="M16.414 15.411a11.303 11.303 0 01-7.207 2.59c-2.64 0-5.182-.917-7.207-2.59v-.407c0-1.229.983-2.268 2.336-2.472l4.87-1.24 4.774 1.22.098.02c1.354.204 2.336 1.243 2.336 2.472v.407zM6.896 6.948c0-.276-.063-.708-.175-1.446-.082-.536-.194-1.27-.194-1.528C6.527 2.904 7.754 2 9.206 2c1.454 0 2.68.904 2.68 1.974 0 .256-.111.991-.192 1.527-.113.74-.176 1.17-.176 1.447a2.31 2.31 0 01-2.221 2.303l-.09-.024-.09.024a2.31 2.31 0 01-2.221-2.303zm7.533 3.614l-2.186-.558a4.298 4.298 0 001.275-3.055c0-.15.089-.726.153-1.146.13-.859.216-1.45.216-1.829 0-2.19-2.1-3.974-4.681-3.974-2.58 0-4.68 1.783-4.68 3.974 0 .38.087.97.217 1.83.064.42.152.995.153 1.144 0 1.193.489 2.275 1.274 3.056l-2.185.558C1.673 10.935 0 12.795 0 15.004v1.313l.334.3A13.3 13.3 0 009.207 20c3.278 0 6.43-1.202 8.873-3.384l.334-.299v-1.313c0-2.209-1.673-4.069-3.985-4.442z"/>
        </symbol>
    </svg>
</html>
