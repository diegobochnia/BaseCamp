<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | BaseCamp</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="../assests/js/cabecalho.js" defer></script>
</head>
<body>
    <header class="bg-green-900 text-white shadow-md">
        <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-x-3 gap-y-4 px-4 py-4 sm:px-6 lg:flex-nowrap lg:gap-6">
            <a href="../index.html" class="flex shrink-0 items-center gap-2 lg:gap-3 rounded-md focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-yellow-400" aria-label="BaseCamp — página inicial">
                <img src="images/logo-basecamp.png" alt="" width="56" height="56" class="h-10 w-10 lg:h-14 lg:w-14 shrink-0 rounded-full object-contain" />
                <span class="whitespace-nowrap text-xl font-bold lg:text-2xl tracking-wide"><span class="text-yellow-400">Base</span><span class="text-green-300">Camp</span></span>
            </a>
            <div class="ml-auto flex items-center gap-2 lg:order-3 lg:ml-0">
                <button type="button" data-menu-toggle aria-controls="menu-principal" aria-expanded="false" aria-label="Abrir menu" class="flex h-11 w-11 items-center justify-center rounded-md transition hover:bg-green-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-yellow-400 lg:hidden">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-6 w-6" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
                </button>
                <a href="login.html" aria-current="page" aria-label="Entrar" class="flex min-h-11 min-w-11 items-center justify-center gap-2 rounded-md px-3 py-2 transition focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-yellow-400 bg-green-800 font-bold text-yellow-300 ring-1 ring-inset ring-green-600"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-5 w-5 shrink-0" aria-hidden="true"><circle cx="12" cy="8" r="4" /><path d="M4 21v-2a8 8 0 0 1 16 0v2" /></svg><span class="hidden lg:inline">Entrar</span></a>
            </div>
            <nav id="menu-principal" aria-label="Navegação principal" class="hidden w-full min-w-0 lg:order-2 lg:block lg:w-auto lg:ml-auto">
                <ul class="flex flex-col gap-2 text-sm font-medium lg:flex-row lg:items-center">
                    <li><a href="../index.html" class="flex min-h-11 items-center justify-center gap-2 rounded-md px-3 py-2 transition focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-yellow-400 hover:bg-green-800">Início</a></li>
                    <li><a href="integrantes.html" class="flex min-h-11 items-center justify-center gap-2 rounded-md px-3 py-2 transition focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-yellow-400 hover:bg-green-800">Integrantes</a></li>
                    <li><a href="secoes.html" class="flex min-h-11 items-center justify-center gap-2 rounded-md px-3 py-2 transition focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-yellow-400 hover:bg-green-800">Seções</a></li>
                    <li><a href="atividades.html" class="flex min-h-11 items-center justify-center gap-2 rounded-md px-3 py-2 transition focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-yellow-400 hover:bg-green-800">Atividades</a></li>
                    <li><a href="conquistas.html" class="flex min-h-11 items-center justify-center gap-2 rounded-md px-3 py-2 transition focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-yellow-400 hover:bg-green-800">Conquistas</a></li>
                    <li><a href="avisos.html" class="flex min-h-11 items-center justify-center gap-2 rounded-md px-3 py-2 transition focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-yellow-400 hover:bg-green-800">Avisos</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="mx-auto flex min-h-screen max-w-md items-center justify-center px-4 py-12">
        <section class="w-full rounded-xl border border-green-200 bg-white p-6 shadow-lg">
            <div class="mb-6 text-center">
                <p class="text-sm font-semibold uppercase tracking-[0.2em] text-green-700">BaseCamp</p>
                <h1 class="mt-2 text-3xl font-bold text-green-900">Entrar</h1>
            </div>

            <form id="loginForm" class="flex flex-col gap-4" data-login-url="/api/login" data-redirect-url="/index.html">
                <div class="flex flex-col gap-2">
                    <label for="email" class="text-sm font-medium text-green-900">E-mail</label>
                    <input
                        id="email"
                        name="email"
                        type="email"
                        required
                        autocomplete="email"
                        class="rounded-lg border border-green-200 bg-zinc-50 px-3 py-2.5 text-base outline-none transition focus:border-green-700 focus:ring-2 focus:ring-green-200"
                        placeholder="seu@email.com"
                    >
                </div>

                <div class="flex flex-col gap-2">
                    <label for="password" class="text-sm font-medium text-green-900">Senha</label>
                    <div class="relative">
                        <input
                            id="password"
                            name="password"
                            type="password"
                            required
                            autocomplete="current-password"
                            class="w-full rounded-lg border border-green-200 bg-zinc-50 px-3 py-2.5 pr-11 text-base outline-none transition focus:border-green-700 focus:ring-2 focus:ring-green-200"
                            placeholder="Digite sua senha"
                        >
                        <button
                            type="button"
                            data-toggle-password="#password"
                            aria-label="Mostrar senha"
                            aria-pressed="false"
                            class="absolute inset-y-0 right-0 flex items-center px-3 text-green-900 transition hover:text-green-700"
                        >
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5" aria-hidden="true">
                                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="rounded-lg bg-green-900 px-4 py-2.5 font-semibold text-white transition hover:bg-green-800 focus:outline-none focus:ring-2 focus:ring-green-200">
                    Entrar
                </button>
            </form>

            <div class="mt-6 border-t border-green-100 pt-4 text-center">
                <p class="text-sm text-zinc-600">Ainda não tem uma conta?</p>
                <a href="cadastro.html" class="mt-2 inline-flex rounded-lg border border-green-700 px-4 py-2 text-sm font-semibold text-green-800 transition hover:bg-green-50">
                    Criar conta
                </a>
            </div>

        </section>
    </main>

    <script src="../assests/login.js"></script>
</body>
</html>
